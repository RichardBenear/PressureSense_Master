; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32.git#develop
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 921600
upload_speed = 921600

lib_deps =
	AsyncTCP
	arduino-libraries/Arduino_JSON @ 0.1.0
  ayushsharma82/ElegantOTA @ ^3.0.0
	lovyan03/LovyanGFX
  NTPClient

build_flags =
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=128
board_build.partitions = partitions.csv
board_build.filesystem = spiffs

; NOTE: raising CONFIG_LWIP_MAX_ACTIVE_TCP via custom_sdkconfig was tried
; here as a fix for a stale-TCP-connection exhaustion issue, but on this
; pioarduino platform build it forces a "hybrid compilation" that recompiles
; the Arduino core from source instead of using the precompiled
; framework-arduinoespressif32-libs -- and that path linked with an
; undefined reference to __wrap_log_printf (NetworkClient.cpp.o expects a
; symbol a linker fragment normally supplies, which the hybrid rebuild
; doesn't produce). Reverted pending a working way to apply it. See
; ESPAsyncWebServer's IncreaseMaxSockets example if revisiting this.
;
; Revisited: the precompiled framework's default is already
; CONFIG_LWIP_MAX_ACTIVE_TCP=16 (and CONFIG_LWIP_MAX_SOCKETS=16), not tiny,
; and ESPAsyncWebServer's own IncreaseMaxSockets example
; (.pio/libdeps/*/ESPAsyncWebServer/examples/pioarduino/IncreaseMaxSockets)
; only gets the hybrid compile working by pinning an exact platform release
; (55.03.38, vs. this project's floating #develop branch), pinning
; ESP32Async/AsyncTCP + ESP32Async/ESPAsyncWebServer versions, and trimming
; unused IDF components via custom_component_remove -- a bigger, riskier
; toolchain change than is worth making blind (untestable here without
; hardware). Addressed the actual runaway-client-count risk instead with an
; explicit cap in main.cpp's events.onConnect() (MAX_SSE_CLIENTS), which
; doesn't touch this fragile build path. Revisit this recipe directly if
; sseClients/wsClients telemetry (see /sd-usage) ever shows real exhaustion.
